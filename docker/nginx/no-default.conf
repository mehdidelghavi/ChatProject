# Intentionally empty.
#
# The nginx image ships a demo site at /etc/nginx/conf.d/default.conf that
# listens on port 80 with `server_name localhost`. That collides with our own
# server block whenever DOMAIN is localhost ("conflicting server name ...,
# ignored") and which one wins depends on filename order — too fragile to rely
# on. Mounting this file over it removes the demo site entirely.
